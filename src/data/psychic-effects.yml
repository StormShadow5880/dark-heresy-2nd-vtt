# Effects of psychic powers
# ----------------------------------------------------------------------------------------------
# One entry per power (name exactly as in the compendium). The build writes the effects into the
# compendium item (system.autoEffects); they travel with the item when it is dragged onto a character.
# Only powers whose "Sustained" field is not "No" are listed. A power with `[]` can still be sustained,
# it just does not change any values.
#
# After a successful manifestation test the effects are applied to the psyker as an Active Effect,
# the power counts as sustained (psy rating reduced) and stays until it is ended by hand.
#
# One effect = one line:
#   - { characteristic: toughness, field: unnatural, pr: { divide: 2, round: up } }   # psy rating / 2, rounded up
#   - { characteristic: agility,   field: modifier,  value: -10 }                      # fixed value
#
#   characteristic: weaponSkill | ballisticSkill | strength | toughness | agility
#                   | intelligence | perception | willpower | fellowship | influence
#   field:          unnatural   (adds to the characteristic bonus)
#                   modifier    (adds to the characteristic value)
#   value:          fixed number; leave it out to calculate the value from the psy rating
#   pr:             divide (psy rating / divide, default 1), multiply (default 1), round: up | down | none
#
# Fill in only what the power text states. The first lines of each description are copied as a help.
# ----------------------------------------------------------------------------------------------



